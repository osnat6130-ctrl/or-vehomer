<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>פאנל ניהול | אור וחומר</title>
  <link rel="icon" href="images/logo-or-vehomer.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20260917b">
  <style>
    .admin-wrap { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: var(--cream-bg); }
    .admin-card { width: min(100%, 440px); background: var(--white); border-radius: 22px; padding: 32px 30px; box-shadow: 0 18px 44px rgba(74,59,46,.12); }
    .admin-card h1 { font-size: 1.7rem; margin: 0 0 6px; }
    .admin-card .sub { margin: 0 0 22px; color: var(--clay-dark); opacity: .8; }
    .admin-card label { display: block; margin-bottom: 14px; font-weight: 600; }
    .admin-card input[type="text"], .admin-card input[type="password"] {
      width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--sand); border-radius: 12px; font-size: 1rem; background: var(--cream-bg);
    }
    .admin-card input:focus { outline: 3px solid rgba(156,90,46,.35); border-color: var(--terracotta); }
    .admin-remember { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 18px; }
    .admin-error { background: #fdecec; color: #8a1f1f; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-weight: 600; }
    .admin-card .btn { width: 100%; justify-content: center; }
    .admin-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .admin-logo img { width: 44px; height: auto; }
    .admin-back { display: block; text-align: center; margin-top: 16px; font-size: .92rem; }
    .admin-help { font-size: .9rem; line-height: 1.55; color: var(--clay-dark); opacity: .85; margin: 0 0 18px; }
  </style>
</head>
<body>
  <main class="admin-wrap" id="main">
    <div class="admin-card">
      <div class="admin-logo">
        <img src="/images/logo-or-vehomer.png" alt="">
        <strong>אור וחומר</strong>
      </div>
      <h1>פאנל ניהול</h1>

      <div id="signed-in" hidden>
        <p class="sub">את מחוברת בתור <b id="me-name"></b>.</p>
        <p class="admin-help">לחיצה על "התחלת עריכה" פותחת את האתר במצב עריכה: כל טקסט וכל תמונה מסומנים במסגרת מקווקווה, ולחיצה עליהם פותחת עריכה. בסיום לוחצים "שמירה ופרסום" בסרגל התחתון.</p>
        <a class="btn btn-primary" id="start-edit" href="/">התחלת עריכה</a>
        <a class="admin-back" href="#" id="logout">יציאה מהחשבון</a>
      </div>

      <form id="login-form">
        <p class="sub">כניסה לעריכת האתר</p>
        <label>שם משתמש
          <input type="text" name="username" id="username" autocomplete="username" required>
        </label>
        <label>סיסמה
          <input type="password" name="password" id="password" autocomplete="current-password" required>
        </label>
        <label class="admin-remember"><input type="checkbox" id="remember" checked> זכור אותי במחשב הזה</label>
        <div class="admin-error" id="error" hidden></div>
        <button class="btn btn-primary" type="submit" id="submit">כניסה</button>
        <a class="admin-back" href="/">חזרה לאתר</a>
      </form>
    </div>
  </main>

  <script src="/cms/admin-login.js?v=20260917b"></script>
</body>
</html>
